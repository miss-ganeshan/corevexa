<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DYNAMIC QPL — Secure Examination Platform</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap');
:root{
 --bg:#03050b;--ink:#eef8ff;--muted:#718198;--cyan:#56f6ff;--violet:#8b5cf6;--lime:#8dff9d;
 --amber:#ffd166;--red:#ff5470;--line:rgba(132,166,196,.15);--glass:rgba(7,14,25,.74)
}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;min-width:320px;background:#03050b;color:var(--ink);font-family:Inter,sans-serif;overflow-x:hidden}
body:before{content:"";position:fixed;inset:0;z-index:-3;background:
 radial-gradient(ellipse at 20% 0%,rgba(86,246,255,.12),transparent 32%),
 radial-gradient(ellipse at 100% 40%,rgba(139,92,246,.13),transparent 35%),
 linear-gradient(115deg,transparent 0 47%,rgba(86,246,255,.025) 47.2% 47.4%,transparent 47.6% 100%)}
body:after{content:"";position:fixed;inset:0;z-index:-2;opacity:.16;pointer-events:none;
 background-image:linear-gradient(rgba(86,246,255,.10) 1px,transparent 1px),linear-gradient(90deg,rgba(86,246,255,.07) 1px,transparent 1px);
 background-size:36px 36px;mask-image:linear-gradient(to bottom,black,transparent 78%)}
button,input,select{font:inherit}button{cursor:pointer}
.app{min-height:100vh;display:flex}
.sidebar{width:285px;position:fixed;inset:0 auto 0 0;z-index:20;padding:18px 14px;
 background:linear-gradient(180deg,rgba(2,7,14,.96),rgba(4,8,16,.86));border-right:1px solid var(--line)}
.brand{display:flex!important;align-items:center;gap:12px;padding:9px 12px 28px;font:700 19px 'Space Grotesk';letter-spacing:-.6px}
.brand:before{content:"Q";display:grid;place-items:center;width:34px;height:34px;border:1px solid rgba(86,246,255,.45);
 color:var(--cyan);font:700 16px 'Space Grotesk';background:rgba(86,246,255,.04);box-shadow:inset 0 0 18px rgba(86,246,255,.08),0 0 20px rgba(86,246,255,.12)}
.brand:after{content:"";height:1px;flex:1;background:linear-gradient(90deg,var(--cyan),transparent);opacity:.4}
.nav{display:grid;gap:5px}.nav button{position:relative;border:0;background:transparent;color:#718198;text-align:left;padding:12px 12px;
 border-radius:5px;display:flex;gap:12px;align-items:center;transition:.2s;font-size:12px}
.nav button span{font-size:15px;width:20px;text-align:center;color:#52718a}.nav button:hover{background:rgba(86,246,255,.045);color:#dffcff}
.nav button.active{background:linear-gradient(90deg,rgba(86,246,255,.095),transparent);color:#fff}
.nav button.active:before{content:"";position:absolute;left:-14px;top:7px;bottom:7px;width:2px;background:var(--cyan);box-shadow:0 0 15px var(--cyan)}
.nav button.active span{color:var(--cyan);text-shadow:0 0 12px var(--cyan)}
.sidebar-footer{position:absolute;left:20px;right:20px;bottom:20px;padding-top:15px;border-top:1px solid var(--line);
 font-size:9px;letter-spacing:1.2px;line-height:1.8;color:#506078;text-transform:uppercase}
.main{margin-left:285px;width:calc(100% - 285px);padding:22px 34px 55px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}
.eyebrow,.panel-kicker{font-size:9px;letter-spacing:2.6px;color:var(--cyan);font-weight:800;text-transform:uppercase}
.eyebrow:before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--lime);margin-right:8px;box-shadow:0 0 12px var(--lime)}
.top h1{margin:6px 0 0;font:700 29px 'Space Grotesk';letter-spacing:-1px}
.user{font-size:10px;color:#a7b7ca;border:1px solid var(--line);padding:9px 13px;background:rgba(8,15,27,.7);letter-spacing:.7px}
.user:before{content:"●";color:var(--lime);margin-right:8px;font-size:8px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:13px}
.stat-card,.panel,.action-card{background:linear-gradient(145deg,rgba(9,17,29,.88),rgba(3,8,16,.78));border:1px solid var(--line);border-radius:4px;position:relative;overflow:hidden}
.stat-card{padding:16px;min-height:122px}.stat-card:after{content:"";position:absolute;right:-35px;top:-35px;width:95px;height:95px;border:1px solid rgba(86,246,255,.09);transform:rotate(45deg)}
.stat-card:hover,.action-card:hover,.pipeline-step:hover,.rule:hover,.security-feature:hover{border-color:rgba(86,246,255,.3);box-shadow:0 0 30px rgba(86,246,255,.045)}
.stat-icon{width:28px;height:28px;display:grid;place-items:center;color:var(--cyan);border:1px solid rgba(86,246,255,.18);background:rgba(86,246,255,.035);margin-bottom:12px;font-size:12px}
.stat-card span{font-size:9px;letter-spacing:1px;color:#62738b;text-transform:uppercase}.stat-card strong{display:block;font:700 25px 'Space Grotesk';margin:3px 0}.stat-card small{font-size:9px;color:#586a80}
.dashboard-grid{display:grid;grid-template-columns:1.15fr .85fr;gap:12px}.page-grid{display:grid;gap:12px}
.panel{padding:20px}.panel:before{content:"";position:absolute;left:0;top:0;width:45px;height:1px;background:var(--cyan);box-shadow:0 0 15px var(--cyan)}
.panel h2,.panel h3{font-family:'Space Grotesk';margin:6px 0 10px}.muted{color:var(--muted);font-size:11px;line-height:1.6}
.pipeline{display:grid;gap:7px}.pipeline-step,.rule,.security-feature{display:flex;align-items:center;gap:10px;padding:10px;border:1px solid rgba(132,166,196,.10);border-radius:3px;background:rgba(2,8,16,.62);transition:.18s}
.step-number{font:600 9px monospace;color:#4e647b;width:18px}.pipeline-icon,.feature-icon,.rule-icon{width:28px;height:28px;display:grid;place-items:center;color:var(--cyan);border:1px solid rgba(86,246,255,.13);font-size:11px}
.pipeline-step div:nth-child(3),.security-feature div:nth-child(2){flex:1}.pipeline-step strong{display:block;font-size:11px}.pipeline-step span:last-of-type,.security-feature p{color:#61738a;font-size:9px;margin:3px 0}.check{color:var(--lime);font-size:10px}
.section-heading{margin:25px 0 11px}.section-heading span{font-size:9px;color:var(--cyan);letter-spacing:2.5px}.section-heading h3{font:700 17px 'Space Grotesk';margin:5px 0}
.action-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.action-card{padding:15px;text-align:left;color:var(--ink);display:flex;align-items:center;gap:10px;transition:.2s;border-radius:4px}
.action-icon{color:var(--cyan);font-size:15px}.action-card strong{font-size:10px}.action-card p{font-size:9px;color:#607188;line-height:1.4;margin:4px 0 0}.action-card>span{margin-left:auto;color:#52657b}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:12px 9px;border-bottom:1px solid var(--line);font-size:11px}th{font-size:8px;letter-spacing:1.3px;color:#5f7188;text-transform:uppercase}.mono{font-family:monospace;color:var(--cyan)}
.tag,.secure-tag{display:inline-flex;align-items:center;gap:5px;border-radius:2px;padding:4px 7px;background:rgba(139,92,246,.10);color:#bca8ff;font-size:9px;border:1px solid rgba(139,92,246,.15)}
.secure-tag{background:rgba(141,255,157,.06);color:var(--lime);border-color:rgba(141,255,157,.14)}
.form{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.field{display:grid;gap:6px}.field label{font-size:9px;color:#65768b;text-transform:uppercase;letter-spacing:1px}
select,input{width:100%;background:#02070f;border:1px solid var(--line);color:#eaf6ff;padding:11px;border-radius:3px;outline:none;font-size:11px}
select:focus,input:focus{border-color:rgba(86,246,255,.45);box-shadow:0 0 0 2px rgba(86,246,255,.05)}
.primary{background:linear-gradient(90deg,#2563eb,#0891b2);color:#fff;border:1px solid rgba(86,246,255,.22);border-radius:3px;padding:11px 15px;font-weight:800;font-size:10px;letter-spacing:.6px;box-shadow:0 0 25px rgba(37,99,235,.15);transition:.2s}
.primary:hover{filter:brightness(1.15);box-shadow:0 0 30px rgba(86,246,255,.16)}
.result{margin-top:16px;padding:13px;border:1px solid rgba(141,255,157,.18);background:rgba(141,255,157,.035);color:var(--lime);font-size:10px;border-radius:3px}
.vault{text-align:center;padding:54px 20px}.big-lock{width:88px;height:88px;margin:0 auto 18px;display:grid;place-items:center;border:1px solid rgba(86,246,255,.3);
 color:var(--cyan);font-size:28px;background:radial-gradient(circle,rgba(86,246,255,.08),transparent 65%);box-shadow:0 0 45px rgba(86,246,255,.08)}
.verify{max-width:650px;margin:auto;text-align:center}.verify .verify-icon{width:75px;height:75px;margin:0 auto 18px;display:grid;place-items:center;border:1px solid rgba(141,255,157,.25);color:var(--lime);font-size:25px;background:rgba(141,255,157,.04)}
.verify .primary{margin-top:10px}.print-status{display:flex;align-items:center;gap:12px;padding:13px;background:#020810;border:1px solid var(--line);border-radius:3px}.print-status div:nth-child(2){flex:1}.online{color:var(--lime);font-size:9px;font-weight:800}
.rules{display:grid;gap:7px;margin-top:14px}.rule strong{margin-left:auto;color:var(--lime);font-size:8px;letter-spacing:1px}.progress{height:5px;background:#101b29;border-radius:0;overflow:hidden}.progress span{display:block;height:100%;width:75%;background:linear-gradient(90deg,var(--violet),var(--cyan));box-shadow:0 0 10px var(--cyan)}
.number{font:700 35px 'Space Grotesk';margin:13px 0}.number small{font:400 10px Inter;color:var(--muted)}.timeline{display:grid}.event{display:grid;grid-template-columns:90px 1fr 90px;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);font-size:10px}.event time{font-family:monospace;color:#5c7189}.success{color:var(--lime);font-size:8px;font-weight:800}.eco{font:700 38px 'Space Grotesk';color:var(--lime)}
.toast{position:fixed;right:20px;bottom:20px;background:#06101b;border:1px solid rgba(86,246,255,.25);padding:12px 15px;border-radius:3px;box-shadow:0 0 35px rgba(0,0,0,.5);display:none;z-index:99;font-size:10px}.toast.show{display:block}
@media(max-width:1000px){.sidebar{width:225px}.main{margin-left:225px;width:calc(100% - 225px);padding:22px}.stats,.action-grid{grid-template-columns:repeat(2,1fr)}.dashboard-grid{grid-template-columns:1fr}}
@media(max-width:650px){.sidebar{position:static;width:100%;height:auto}.app{display:block}.main{margin:0;width:100%;padding:17px}.nav{grid-template-columns:repeat(2,1fr)}.sidebar-footer{display:none}.stats,.action-grid,.form{grid-template-columns:1fr}.top{align-items:flex-start;gap:10px}.user{display:none}.event{grid-template-columns:65px 1fr}}
</style>

<style>
.command-hero{margin-bottom:13px;border:1px solid rgba(86,246,255,.13);background:linear-gradient(90deg,rgba(86,246,255,.045),transparent 55%);
padding:14px 17px;display:flex;justify-content:space-between;align-items:center;gap:20px;position:relative;overflow:hidden}
.command-hero:after{content:"";position:absolute;left:0;right:0;top:0;height:1px;background:linear-gradient(90deg,transparent,var(--cyan),transparent);
animation:scan 3.2s linear infinite}
.command-meta{font:9px monospace;color:#60758c;letter-spacing:1px}.command-meta b{color:var(--lime)}
@keyframes scan{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
</style>

<style>
.qgen-summary{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0}
.qgen-box{padding:12px;border:1px solid rgba(132,166,196,.12);background:rgba(2,8,16,.62);border-radius:3px}
.qgen-box span{display:block;font-size:8px;color:#60738a;text-transform:uppercase;letter-spacing:1px}
.qgen-box strong{display:block;font:700 22px 'Space Grotesk';margin-top:4px}
.qgen-box:nth-child(2) strong{color:var(--cyan)} .qgen-box:nth-child(3) strong{color:var(--amber)}
.qgen-box:nth-child(4) strong{color:var(--red)}
.selection-note{margin-top:10px;padding:10px;border-left:2px solid var(--violet);background:rgba(139,92,246,.05);font-size:9px;color:#8192a8;line-height:1.5}
.paper-preview{margin-top:14px;border:1px solid rgba(86,246,255,.16);background:rgba(1,7,14,.72);padding:14px}
.paper-preview h4{margin:0 0 10px;font:600 13px 'Space Grotesk'}
.question-row{display:grid;grid-template-columns:34px 1fr auto;gap:9px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);font-size:10px}
.question-row:last-child{border-bottom:0}
.qnum{font-family:monospace;color:var(--cyan)}
.qmeta{font-size:8px;color:#64768b;margin-top:3px}
.badge-repeat{color:#bca8ff}.badge-medium{color:var(--amber)}.badge-hard{color:#ff6d85}
@media(max-width:700px){.qgen-summary{grid-template-columns:repeat(2,1fr)}}
</style>

</head>
<body>
<div class="app">
<aside class="sidebar">
  <div class="brand">DYNAMIC QPL</div>
  <nav class="nav" id="nav"></nav>
  <div class="sidebar-footer">Dynamic Question Paper Lifecycle<br>Security Framework • Zero-Trust • Audited</div>
</aside>
<main class="main">
  <header class="top"><div><div class="eyebrow">● LIVE • DYNAMIC QPL SECURITY PLATFORM</div><h1 id="title">Lifecycle Dashboard</h1></div><div class="user">Admin • Secure Session</div></header>
  <div class="command-hero"><div><div class="panel-kicker">SECURE EXAMINATION COMMAND CENTER</div><div style="font:600 12px Space Grotesk;margin-top:4px">LIVE LIFECYCLE MONITORING</div></div><div class="command-meta">NODE <b>QPL-07</b> &nbsp; // &nbsp; ENCRYPTION <b>AES-256</b> &nbsp; // &nbsp; STATUS <b>ONLINE</b></div></div><section id="content"></section>
</main>
</div>
<div class="toast" id="toast"></div>
<script>
const icons={
dashboard:"⌂",questions:"▤",generator:"✦",vault:"🔒",printing:"▣",verify:"✓",audit:"≡",sustainability:"♻"
};
const titles={dashboard:"Lifecycle Dashboard",questions:"Verified Question Bank",generator:"Dynamic Paper Generator",vault:"Secure Examination Vault",printing:"Controlled Secure Printing",verify:"Paper Verification",audit:"Tamper-Evident Audit Ledger",sustainability:"Lifecycle Analytics"};
let page="dashboard";
const nav=document.getElementById("nav");
Object.keys(titles).forEach(k=>{const b=document.createElement("button");b.dataset.page=k;b.innerHTML=`<span>${icons[k]}</span>${titles[k].replace("Lifecycle Dashboard","Dashboard").replace("Verified Question Bank","Question Bank").replace("Dynamic Paper Generator","Paper Generator").replace("Secure Examination Vault","Secure Vault").replace("Controlled Secure Printing","Secure Printing").replace("Paper Verification","Verification").replace("Tamper-Evident Audit Ledger","Audit Ledger").replace("Lifecycle Analytics","Sustainability")}`;b.onclick=()=>go(k);nav.appendChild(b)});
function toast(msg){const t=document.getElementById("toast");t.textContent=msg;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),2400)}
function go(p){page=p;document.getElementById("title").textContent=titles[p];document.querySelectorAll(".nav button").forEach(b=>b.classList.toggle("active",b.dataset.page===p));render()}
function render(){document.getElementById("content").innerHTML=pages[page]();bind()}
const pages={
dashboard:()=>`
<div class="stats">
<div class="stat-card"><div class="stat-icon">✓</div><span>Security Status</span><strong>Protected</strong><small>All systems operational</small></div>
<div class="stat-card"><div class="stat-icon">▤</div><span>Question Bank</span><strong>100+</strong><small>Verified questions • 25-question dynamic output</small></div>
<div class="stat-card"><div class="stat-icon">🔒</div><span>Vault Status</span><strong>Locked</strong><small>Zero-trust enforced</small></div>
<div class="stat-card"><div class="stat-icon">◉</div><span>Risk Score</span><strong>12%</strong><small>Low risk</small></div></div>
<div class="dashboard-grid">
<div class="panel"><div class="panel-kicker">DYNAMIC QUESTION PAPER LIFECYCLE</div><h3>Dynamic Question Paper Lifecycle</h3><div class="pipeline">
${["Question Validation|Verified","Paper Generation|On Demand","AES-256 Encryption|Encrypted","Secure Vault|Locked","Controlled Printing|Protected"].map((x,i)=>{let a=x.split("|");return `<div class="pipeline-step"><span class="step-number">0${i+1}</span><div class="pipeline-icon">✓</div><div><strong>${a[0]}</strong><span>${a[1]}</span></div><span class="check">✓</span></div>`}).join("")}</div></div>
<div class="panel"><div class="panel-kicker">RISK MONITORING</div><h3>Current Risk Posture</h3><div class="pipeline">
${["Identity Risk|12%","Content Exposure|8%","Print Risk|15%","System Risk|6%"].map(x=>{let a=x.split("|");return `<div class="field" style="margin:12px 0"><div style="display:flex;justify-content:space-between;font-size:12px"><span>${a[0]}</span><b>${a[1]}</b></div><div class="progress"><span style="width:${a[1]}"></span></div></div>`}).join("")}</div></div></div>
<div class="section-heading"><span>LIFECYCLE + SECURITY FRAMEWORK</span><h3>End-to-End Protection</h3></div>
<div class="dashboard-grid">
<div class="panel">
<div class="panel-kicker">DYNAMIC QUESTION PAPER LIFECYCLE</div><h3>Paper Journey</h3>
<div class="pipeline">
${[
["01","Question Creation","Create and classify question content."],
["02","Validation","Review and approve questions."],
["03","Dynamic Assembly","Generate a balanced paper on demand."],
["04","Encryption","Protect the paper before storage."],
["05","Secure Vault","Release only after authorization."],
["06","Controlled Printing","Track and control every print."],
["07","Verification & Audit","Verify integrity and record events."]
].map(x=>`<div class="pipeline-step"><span class="step-number">${x[0]}</span><div class="pipeline-icon">✓</div><div><strong>${x[1]}</strong><span>${x[2]}</span></div><span class="check">✓</span></div>`).join("")}
</div></div>
<div class="panel">
<div class="panel-kicker">SECURITY FRAMEWORK</div><h3>Core Security Controls</h3>
<div class="rules">
${["Zero-Trust access","MFA authentication","Role-based authorization","AES-256 encryption","SHA-256 integrity verification","Two-person print control","Tamper-evident audit ledger"].map(x=>`<div class="rule"><span>🔐 ${x}</span><strong>ENFORCED</strong></div>`).join("")}
</div></div>
</div>
<div class="section-heading"><span>QUICK ACTIONS</span><h3>Secure Examination Operations</h3></div>
<div class="action-grid">${[["generator","✦","Generate Paper","Create an on-demand examination paper."],["vault","🔒","Open Secure Vault","Access protected examination assets."],["verify","✓","Verify Paper","Check authenticity and integrity."],["audit","≡","View Audit Trail","Track every critical lifecycle event."]].map(a=>`<button class="action-card" data-go="${a[0]}"><div class="action-icon">${a[1]}</div><div><strong>${a[2]}</strong><p>${a[3]}</p></div><span>›</span></button>`).join("")}</div>`,
questions:()=>`<div class="page-grid"><div class="panel full"><div class="panel-header"><div><div class="panel-kicker">VERIFIED DATABASE</div><h3>Question Bank</h3></div><span class="tag">10,000+ Questions</span></div><div style="overflow:auto"><table><thead><tr><th>ID</th><th>Subject</th><th>Difficulty</th><th>Security</th></tr></thead><tbody>${[["CS101","Data Structures","Easy"],["CS204","Computer Networks","Medium"],["CS305","Cyber Security","Hard"],["CS402","Artificial Intelligence","Medium"],["CS410","Cloud Computing","Hard"]].map(q=>`<tr><td class="mono">${q[0]}</td><td>${q[1]}</td><td><span class="tag">${q[2]}</span></td><td><span class="secure-tag">✓ Verified</span></td></tr>`).join("")}</tbody></table></div></div></div>`,
generator:()=>`<div class="page-grid">
<div class="panel">
<div class="panel-kicker">INTELLIGENT QUESTION SELECTION</div>
<h3>Dynamic Paper Generator</h3>
<p class="muted">Generate exactly 25 questions from a 100-question bank using previous-exam repetition and difficulty intelligence.</p>

<div class="form">
<div class="field"><label>Question Bank Size</label><input id="bankSize" type="number" value="100" min="25"></div>
<div class="field"><label>Previous Exam Data</label><select id="history"><option value="enabled">Use Previous Exam Frequency</option><option value="disabled">Ignore Previous Exam Frequency</option></select></div>
<div class="field"><label>Repeated Questions</label><input id="repeatCount" type="number" value="10" min="0" max="25"></div>
<div class="field"><label>Medium Questions</label><input id="mediumCount" type="number" value="10" min="0" max="25"></div>
<div class="field"><label>Very Hard Questions</label><input id="hardCount" type="number" value="5" min="0" max="25"></div>
<div class="field"><label>Total Paper Questions</label><input id="totalCount" type="number" value="25" readonly></div>
</div>

<div class="qgen-summary">
<div class="qgen-box"><span>Source Bank</span><strong id="sumBank">100</strong></div>
<div class="qgen-box"><span>Most Repeated</span><strong id="sumRepeat">10</strong></div>
<div class="qgen-box"><span>Medium</span><strong id="sumMedium">10</strong></div>
<div class="qgen-box"><span>Very Hard</span><strong id="sumHard">5</strong></div>
</div>

<div class="selection-note">
<b>Selection logic:</b> 10 questions are ranked from the highest previous-exam frequency,
10 are selected from the medium-difficulty pool, and 5 are selected from the very-hard pool.
The final paper contains exactly 25 unique question slots.
</div>

<br><button class="primary" id="generate">✦ Generate 25-Question Secure Paper</button>
<div id="genResult"></div>
<div id="paperPreview"></div>
</div>

<div class="panel">
<div class="panel-kicker">QUESTION SELECTION ENGINE</div>
<h3>How the 25 are selected</h3>
${[
["01","Frequency Ranking","Previous exam history ranks questions by how often they appeared."],
["02","Top 10 Repeated","The 10 highest-frequency questions are selected first."],
["03","Medium Difficulty","10 questions are selected from the medium-difficulty pool."],
["04","Very Hard Difficulty","5 questions are selected from the very-hard pool."],
["05","Validation","Duplicates and invalid allocations are rejected before generation."],
["06","Secure Assembly","The 25-question paper is encrypted, vaulted and audit logged."]
].map(x=>`<div class="security-feature"><div class="feature-icon">${x[0]}</div><div><strong>${x[1]}</strong><p>${x[2]}</p></div><span class="check">✓</span></div>`).join("")}
</div>
</div>`,
vault:()=>`<div class="page-grid"><div class="panel vault"><div class="big-lock">🔒</div><div class="panel-kicker">ZERO-TRUST SECURE VAULT</div><h2>Access Verification Required</h2><p class="muted">Your identity, role and risk level will be evaluated before protected examination content is released.</p><button class="primary" id="mfa">⌁ Authenticate with MFA</button><div id="vaultResult"></div></div></div>`,
printing:()=>`<div class="dashboard-grid"><div class="panel"><div class="panel-kicker">CONTROLLED ENVIRONMENT</div><h3>Secure Print Room</h3><div class="print-status"><div class="action-icon">▣</div><div><strong>Printer Ready</strong><p class="muted">Offline secure printing enabled</p></div><span class="online">READY</span></div><div class="rules">${[["Two-Person Rule","Active"],["Print Count Control","Enabled"],["Dynamic Watermark","Enabled"]].map(x=>`<div class="rule"><span>${x[0]}</span><strong>${x[1]}</strong></div>`).join("")}</div></div><div class="panel"><div class="panel-kicker">CURRENT JOB</div><h3>CRX-EXAM-2026-024</h3><div class="number">24 <small>copies</small></div><div class="progress"><span></span></div><p class="muted">18 of 24 copies printed</p><button class="primary" id="print">Continue Secure Print</button></div></div>`,
verify:()=>`<div class="panel verify"><div class="verify-icon">✓</div><div class="panel-kicker">PAPER AUTHENTICITY</div><h2>Verify Examination Paper</h2><p class="muted">Enter a paper ID to verify its authenticity and integrity.</p><input id="paperId" value="CRX-EXAM-2026-024" placeholder="Enter Paper ID"><button class="primary" id="verifyBtn">✓ Verify Paper</button><div id="verifyResult"></div></div>`,
audit:()=>`<div class="panel"><div class="panel-kicker">IMMUTABLE EVENT HISTORY</div><h3>Audit Ledger</h3><div class="timeline">${[["09:42:18","Paper Generated","Admin"],["09:43:02","AES-256 Encryption","System"],["09:44:15","MFA Authentication","Exam Staff"],["09:45:27","Secure Vault Access","Exam Staff"],["09:51:44","Print Request","Exam Staff"],["09:54:02","Watermark Applied","System"],["10:02:11","Risk Alert","System"]].map(e=>`<div class="event"><time>${e[0]}</time><span>${e[1]}<small class="muted"> • ${e[2]}</small></span><span class="success">SUCCESS</span></div>`).join("")}</div></div>`,
sustainability:()=>`<div class="dashboard-grid"><div class="panel"><div class="panel-kicker">SUSTAINABILITY</div><h3>Paper Reduction</h3><div class="eco">32%</div><p class="muted">Estimated reduction through on-demand generation and controlled printing.</p><div class="progress"><span style="width:68%"></span></div></div><div class="panel"><div class="panel-kicker">EFFICIENCY</div><h3>Secure Infrastructure</h3><div class="pipeline">${["Reuse existing infrastructure","Print only when required","Reduce paper waste","Track print lifecycle"].map(x=>`<div class="security-feature"><div class="feature-icon">♻</div><div><strong>${x}</strong><p>Operational control</p></div><span class="check">✓</span></div>`).join("")}</div></div></div>`
};
function bind(){
document.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>go(b.dataset.go));
const gen=document.getElementById("generate");
if(gen) {
  const updateSummary=()=>{
    ["bankSize","repeatCount","mediumCount","hardCount"].forEach(id=>{
      const el=document.getElementById(id);
      if(el) el.addEventListener("input",()=>{
        const map={bankSize:"sumBank",repeatCount:"sumRepeat",mediumCount:"sumMedium",hardCount:"sumHard"};
        document.getElementById(map[id]).textContent=el.value;
      });
    });
  };
  updateSummary();
  gen.onclick=()=>{
    const bank=Number(document.getElementById("bankSize").value);
    const repeat=Number(document.getElementById("repeatCount").value);
    const medium=Number(document.getElementById("mediumCount").value);
    const hard=Number(document.getElementById("hardCount").value);
    const total=repeat+medium+hard;
    const result=document.getElementById("genResult");
    const preview=document.getElementById("paperPreview");

    if(bank<25){result.innerHTML='<div class="result" style="color:var(--red)">✕ Question bank must contain at least 25 questions.</div>';preview.innerHTML="";return;}
    if(total!==25){result.innerHTML=`<div class="result" style="color:var(--red)">✕ Allocation must total exactly 25. Current allocation: ${total}.</div>`;preview.innerHTML="";return;}
    if(repeat>bank || medium>bank || hard>bank){result.innerHTML='<div class="result" style="color:var(--red)">✕ Selection count cannot exceed the question bank.</div>';preview.innerHTML="";return;}

    const rows=[];
    for(let i=1;i<=repeat;i++) rows.push({type:"Most Repeated",cls:"badge-repeat",id:`REP-${String(i).padStart(3,"0")}`,desc:`Highest previous-exam frequency question #${i}`});
    for(let i=1;i<=medium;i++) rows.push({type:"Medium",cls:"badge-medium",id:`MED-${String(i).padStart(3,"0")}`,desc:`Medium-difficulty question #${i}`});
    for(let i=1;i<=hard;i++) rows.push({type:"Very Hard",cls:"badge-hard",id:`HARD-${String(i).padStart(3,"0")}`,desc:`Very-hard question #${i}`});

    preview.innerHTML=`<div class="paper-preview">
      <h4>GENERATED PAPER • 25 QUESTIONS</h4>
      ${rows.map((q,i)=>`<div class="question-row"><span class="qnum">Q${String(i+1).padStart(2,"0")}</span><div><b>${q.id}</b><div class="qmeta">${q.desc}</div></div><span class="${q.cls}">${q.type.toUpperCase()}</span></div>`).join("")}
    </div>`;
    result.innerHTML=`<div class="result">✓ 25-question paper generated: ${repeat} most repeated + ${medium} medium + ${hard} very hard. Encrypted, vaulted and recorded in the security audit ledger.</div>`;
    toast("25-question paper generated");
  };
}
const mfa=document.getElementById("mfa");if(mfa)mfa.onclick=()=>{document.getElementById("vaultResult").innerHTML='<div class="result">✓ MFA verified. Secure vault access granted for this session.</div>';toast("Identity verified")};
const vb=document.getElementById("verifyBtn");if(vb)vb.onclick=()=>{let id=document.getElementById("paperId").value.trim();document.getElementById("verifyResult").innerHTML=id?'<div class="result">✓ Authentic Paper — SHA-256 integrity verification passed.</div>':'<div class="result">Enter a valid paper ID.</div>';};
const pr=document.getElementById("print");if(pr)pr.onclick=()=>toast("Secure print job resumed");
}
go("dashboard");
</script>
</body>
</html>
